      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="flag-red" x1="0%" y1="0%" x2="100%" y2="0%">
