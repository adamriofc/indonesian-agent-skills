<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <!-- Title Accent Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    
    <!-- Red Flag Gradient -->
    <linearGradient id="flag-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- Card Background with Subtle Border -->
  <rect width="1200" height="260" rx="10" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Top Indonesian Red Flag Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#flag-grad)"/>
  
  <!-- Top Right Release Version Badge -->
  <g transform="translate(1020, 36)">
    <rect x="0" y="0" width="132" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34D399"/>
    <text x="28" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" letter-spacing="0.3">v6.11.0 RELEASE</text>
  </g>

  <!-- Main Title & Subtitle -->
  <g transform="translate(48, 48)">
    <text x="0" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">
      indonesian-business-agent-skills
    </text>
    
    <text x="0" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8" letter-spacing="-0.1">
      Open-Source Business Intelligence &amp; Deterministic Engine Infrastructure for AI Agents
    </text>
  </g>

  <!-- Horizontal Separator Line -->
  <line x1="48" y1="160" x2="1152" y2="160" stroke="#1E293B" stroke-width="1"/>

  <!-- 5 Stat Columns (Super Precise Horizontal Distribution: x = 48, 278, 518, 758, 988) -->
  <g transform="translate(0, 184)">
    <!-- Stat 1: Agent Skills -->
    <g transform="translate(48, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">AGENT SKILLS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#38BDF8">88 Skills (6 Plugins)</text>
    </g>

    <!-- Stat 2: Computational Engines -->
    <g transform="translate(278, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">COMPUTATIONAL ENGINES</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#34D399">39 Deterministic</text>
    </g>

    <!-- Stat 3: Golden Corpus -->
    <g transform="translate(518, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">GOLDEN CORPUS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#FBBF24">121 Cases (27 Domains)</text>
    </g>

    <!-- Stat 4: Benchmark Assertions -->
    <g transform="translate(758, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">BENCHMARK ASSERTIONS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#C084FC">424 Assertions</text>
    </g>

    <!-- Stat 5: Release Boundary -->
    <g transform="translate(988, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">RELEASE BOUNDARY</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#F43F5E">v6.11.0 (Level L3)</text>    </g>
  </g>
</svg>
