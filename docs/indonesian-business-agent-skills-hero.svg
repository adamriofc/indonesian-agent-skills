<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <rect width="1200" height="240" rx="8" fill="#0B0F19"/>
  
  <!-- Subtle Top Indonesian Flag Accent -->
  <rect x="0" y="0" width="1200" height="4" fill="#E11D48"/>
  
  <!-- Main Title & Tagline -->
  <g transform="translate(50, 55)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">
      indonesian-business-agent-skills
    </text>
    
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      Open-Source Business Intelligence &amp; Deterministic Engine Infrastructure for AI Agents
    </text>
  </g>

  <!-- Clean Minimal Stats (Without heavy card wrappers, perfectly aligned) -->
  <g transform="translate(50, 175)">
    <!-- Stat 1: Agent Skills -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">AGENT SKILLS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#38BDF8">87 Skills (6 Plugins)</text>
    </g>

    <!-- Stat 2: Deterministic Engines -->
    <g transform="translate(240, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">COMPUTATIONAL ENGINES</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#34D399">38 Deterministic</text>
    </g>

    <!-- Stat 3: Golden Cases -->
    <g transform="translate(480, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">GOLDEN CORPUS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#FBBF24">94 Cases (27 Domains)</text>
    </g>

    <!-- Stat 4: Benchmark Assertions -->
    <g transform="translate(720, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">BENCHMARK ASSERTIONS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#A78BFA">424 Assertions</text>
    </g>

    <!-- Stat 5: Release Boundary -->
    <g transform="translate(950, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">RELEASE BOUNDARY</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#F43F5E">v6.7.0 (Level L3)</text>
    </g>
  </g>
</svg>
