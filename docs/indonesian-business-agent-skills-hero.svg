<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <rect width="1200" height="380" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Header Accent Line (Indonesia Flag Element: Red/White) -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="#DC2626"/>
  
  <!-- Content Group -->
  <g transform="translate(60, 90)">
    <!-- Top Monospace Tag -->
    <rect x="0" y="0" width="270" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#38BDF8">v1.0.0 • PRODUCTION-ORIENTED</text>
    
    <!-- Repository Title -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      indonesian-business-agent-skills
    </text>
    
    <!-- Tagline -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      Deterministic Regulatory Computation &amp; Agent Intelligence Infrastructure
    </text>
  </g>

  <!-- Technical Metric Cards -->
  <g transform="translate(60, 260)">
    <!-- Metric 1: 700+ Tests -->
    <g transform="translate(0, 0)">
      <rect width="200" height="64" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-transform="uppercase">CI Test Suite</text>
      <text x="16" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#10B981">700+ Assertions</text>
    </g>

    <!-- Metric 2: SHA-256 Checksums -->
    <g transform="translate(216, 0)">
      <rect width="200" height="64" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-transform="uppercase">Ruleset Integrity</text>
      <text x="16" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#F59E0B">SHA-256 Checksum</text>
    </g>

    <!-- Metric 3: Temporal Engine -->
    <g transform="translate(432, 0)">
      <rect width="200" height="64" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-transform="uppercase">Taxation Engine</text>
      <text x="16" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#38BDF8">TER &amp; Art 17 Dec</text>
    </g>

    <!-- Metric 4: Multi-Node CI -->
    <g transform="translate(648, 0)">
      <rect width="200" height="64" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-transform="uppercase">CI Matrix</text>
      <text x="16" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#8B5CF6">Node 18 / 20 / 22</text>
    </g>

    <!-- Metric 5: Statutory Basis -->
    <g transform="translate(864, 0)">
      <rect width="216" height="64" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-transform="uppercase">Active Regulations</text>
      <text x="16" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#EC4899">PP 58 &amp; PP 35</text>
    </g>
