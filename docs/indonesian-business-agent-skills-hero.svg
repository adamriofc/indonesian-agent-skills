<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <rect width="1200" height="240" rx="8" fill="#0B0F19"/>
  
  <!-- Subtle Top Indonesian Flag Accent -->
  <rect x="0" y="0" width="1200" height="3" fill="#E11D48"/>
  
  <!-- Main Title & Tagline -->
  <g transform="translate(50, 65)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">
      indonesian-business-agent-skills
    </text>
    
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      Open-Source Business Intelligence &amp; Deterministic Engine Infrastructure for AI Agents
    </text>
  </g>

  <!-- Clean Minimal Stats (Without heavy card wrappers) -->
  <g transform="translate(50, 175)">
    <!-- Stat 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">AGENT SKILLS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#38BDF8">55 Skills (6 Plugins)</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(230, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">COMPUTATIONAL ENGINES</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#34D399">17 Deterministic</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(460, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">TEST ASSERTIONS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#FBBF24">900+ Assertions</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(690, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">RULESET INTEGRITY</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#A78BFA">SHA-256 Integrity</text>
    </g>

    <!-- Stat 5 -->
    <g transform="translate(920, 0)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">LATEST REGULATION</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#F43F5E">PP 20/2026 &amp; PP 58</text>
    </g>
  </g>
</svg>
